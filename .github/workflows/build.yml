
name: Build Minecraft Plugin

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

- name: Build Plugin
  working-directory: PvPMod-ohne-25-Prozent-Schadenslimit
  run: chmod +x gradlew && ./gradlew clean test build

      - name: Upload Plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: PvPMod
          path: build/libs/*.jar
